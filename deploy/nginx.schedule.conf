# schedule.nikitagricanuk.ru -> calendar_service (docker, 127.0.0.1:8091)
# Serves .ics calendar subscriptions for Smart-schedule-IRNITU.
# Install: copy to /etc/nginx/conf.d/schedule.nikitagricanuk.ru.conf
#          then `sudo nginx -t && sudo systemctl reload nginx`

server {
    listen 80;
    listen [::]:80;
    server_name schedule.nikitagricanuk.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name schedule.nikitagricanuk.ru;

    ssl_certificate     /etc/cloudflare/certs/nikitagricanuk.ru/fullchain.pem;
    ssl_certificate_key /etc/cloudflare/certs/nikitagricanuk.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Calendar apps (Google/Apple/Outlook) poll on their own schedule; keep
    # responses cacheable briefly and don't buffer the small .ics payloads.
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    client_max_body_size 1m;

    access_log /var/log/nginx/schedule.access.log;
    error_log  /var/log/nginx/schedule.error.log;
}
