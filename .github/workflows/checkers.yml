name: CI

on:
  pull_request:
    branches:
      - '*'
    types: [ opened, reopened, synchronize ]

# Runs on the self-hosted runner on novsrv (the production server).
jobs:

  Python-syntax-checker:

    runs-on: [self-hosted, Linux, X64]

    steps:
    - uses: actions/checkout@v4
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names;
        # the second pass only reports warnings (exit-zero)
        docker run --rm -v "$PWD:/src:Z" -w /src python:3.8 sh -c "
          pip install --quiet flake8 &&
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics &&
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics"

  Docker-compose-build-checker:

    runs-on: [self-hosted, Linux, X64]
    env:
      # Separate project name so CI images never replace the production stack's images.
      COMPOSE_PROJECT_NAME: smart-schedule-ci

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker compose build
    - name: Remove CI images
      if: always()
      run: docker compose down --rmi local --remove-orphans
