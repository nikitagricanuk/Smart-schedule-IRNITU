name: CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: cd-master
  cancel-in-progress: false

# Both jobs run on the self-hosted runner on novsrv (the production server),
# registered for this repository under ~/actions-runner as the deploy user.
# Only this push-to-master workflow may use it: the repo is public, so PR checks
# (checkers.yml) stay on GitHub-hosted runners and never run fork code on the server.
jobs:
  quality:
    name: Quality gate
    runs-on: [self-hosted, Linux, X64, novsrv]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint (syntax errors only)
        run: |
          docker run --rm -v "$PWD:/src:Z" -w /src python:3.8 sh -c \
            "pip install --quiet flake8 && flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics"

      - name: Validate compose file
        run: docker compose -f docker-compose.yaml config --quiet

  deploy:
    name: Deploy to server
    needs: quality
    runs-on: [self-hosted, Linux, X64, novsrv]
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/deploy/Smart-schedule-IRNITU' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The deploy dir holds two files that are NOT in git and must survive the sync:
      #   .env                  - real tokens / DB creds
      #   vpn/config/awg0.conf  - AmneziaWG client config (keys)
      - name: Sync repository to deploy directory
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude 'vpn/config/' \
            --exclude 'data/' \
            --exclude 'backup/' \
            ./ "${DEPLOY_PATH}/"

      - name: Build images and restart stack
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          set -eu
          test -f .env || { echo 'missing .env on server'; exit 1; }
          test -f vpn/config/awg0.conf || { echo 'missing vpn/config/awg0.conf on server'; exit 1; }
          docker compose build
          docker compose up -d --remove-orphans
          docker compose ps
